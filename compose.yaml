version: '3.8'

services:
  # ==========================================
  # SEGMENTO IZQUIERDO (Equivale a Hub0)
  # Red: 192.168.1.0/29
  # ==========================================
  pc0:
    image: alpine
    container_name: pc0
    # Borramos el gateway por defecto de Docker y le apuntamos a nuestro Router0
    command: sh -c "ip route del default && ip route add default via 192.168.1.6 && tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    networks:
      red_izquierda:
        ipv4_address: 192.168.1.2

  pc1:
    image: alpine
    container_name: pc1
    command: sh -c "ip route del default && ip route add default via 192.168.1.6 && tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    networks:
      red_izquierda:
        ipv4_address: 192.168.1.3

  # ==========================================
  # SEGMENTO DERECHO (Equivale a Hub1)
  # Red: 192.168.1.8/29
  # ==========================================
  pc2:
    image: alpine
    container_name: pc2
    command: sh -c "ip route del default && ip route add default via 192.168.1.14 && tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    networks:
      red_derecha:
        ipv4_address: 192.168.1.10

  pc3:
    image: alpine
    container_name: pc3
    command: sh -c "ip route del default && ip route add default via 192.168.1.14 && tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    networks:
      red_derecha:
        ipv4_address: 192.168.1.11

  # ==========================================
  # ROUTER CENTRAL (Router0)
  # ==========================================
  # ==========================================
  # ROUTER CENTRAL (Router0)
  # ==========================================
  router0:
    image: alpine
    container_name: router0
    # Ya no intentamos forzar el sysctl por comando, solo lo mantenemos vivo
    command: tail -f /dev/null
    cap_add:
      - NET_ADMIN
    # ESTA ES LA MAGIA: Le pedimos a Docker que habilite el ruteo nativamente
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      red_izquierda:
        ipv4_address: 192.168.1.6
      red_derecha:
        ipv4_address: 192.168.1.14
# ==========================================
# DEFINICIÓN DE LAS REDES (Los "Hubs")
# ==========================================
networks:
  red_izquierda:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/29

  red_derecha:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.8/29